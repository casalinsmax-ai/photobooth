<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Foto del Evento - Photobooth Pro</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 20px 15px;
            text-align: center;
        }
        header {
            margin-top: 10px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #f1c40f;
        }
        p.subtitulo {
            font-size: 14px;
            color: #aaa;
            margin-top: 4px;
        }
        .container-photo {
            width: 100%;
            max-width: 450px;
            background: #1a1a1a;
            padding: 12px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 1px solid #333;
        }
        .photo-frame {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background-color: #262626;
            min-height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .photo-frame img {
            width: 100%;
            height: auto;
            display: block;
        }
        .actions {
            width: 100%;
            max-width: 450px;
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            color: white;
            transition: transform 0.2s, background-color 0.2s;
            border: none;
            cursor: pointer;
        }
        .btn-download {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4);
        }
        .btn-share {
            background: linear-gradient(135deg, #25D366, #128C7E);
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
        }
        footer {
            margin-top: 30px;
            font-size: 12px;
            color: #666;
        }
        footer a {
            color: #f1c40f;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>✨ ¡GRACIAS POR ACOMPAÑARNOS! ✨</h1>
        <p class="subtitulo">Descarga tu foto en alta calidad</p>
    </header>

    <div class="container-photo">
        <div class="photo-frame">
            <img id="fotoEvento" src="" alt="Cargando tu foto...">
        </div>
    </div>

    <div class="actions">
        <a id="btnDescargar" href="#" download="Foto_Evento.jpg" class="btn btn-download">
            📥 DESCARGAR FOTO HD
        </a>
        <a id="btnCompartir" href="#" target="_blank" class="btn btn-share">
            💬 COMPARTIR EN WHATSAPP
        </a>
    </div>

    <footer>
        <p>Photobooth Pro &copy; 2026 | Servicio por <a href="#">Tu Empresa</a></p>
    </footer>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const fotoUrl = urlParams.get('foto');

        if (fotoUrl) {
            const imgElement = document.getElementById('fotoEvento');
            const btnDescargar = document.getElementById('btnDescargar');
            const btnCompartir = document.getElementById('btnCompartir');

            imgElement.src = fotoUrl;
            btnDescargar.href = fotoUrl;

            const mensajeWA = encodeURIComponent(`¡Mira mi foto del evento! 🎉\n${fotoUrl}`);
            btnCompartir.href = `https://api.whatsapp.com/send?text=${mensajeWA}`;
        } else {
            document.querySelector('.container-photo').innerHTML = '<p style="padding:20px; color:#e74c3c;">No se encontró la foto solicitada.</p>';
        }
    </script>
</body>
</html>
